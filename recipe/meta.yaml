{% set name = "grpc-google-iam-v1" %}
{% set version = "0.14.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 07fd3a9fafb586588e771831fbfc8f6597050181d0c3b45e039d18b8fdc1aab5

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - grpcio >=1.59.0,<2.0.0
    - googleapis-common-protos >=1.69.2,<2.0.0
    - googleapis-common-protos-grpc
    - protobuf >=6.33.5,<8.0.0

test:
  requires:
    - pip
    - pytest
  source_files:
    - tests/unit
  imports:
    - google.iam.v1
    - google.iam.v1.iam_policy_pb2
    - google.iam.v1.logging
    - google.iam.v1.logging.audit_data_pb2
    - google.iam.v1.policy_pb2
  commands:
    - pip check
    - pytest -vv tests/unit

about:
  home: https://cloud.google.com/iam
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  summary: GRPC library for the google-iam-v1 service
  description: |
    grpc-google-iam-v1 is the IDL-derived library for the
    google-iam v1 service in the googleapis repository.
  doc_url: https://cloud.google.com/python/docs/reference/grpc-iam/latest
  dev_url: https://github.com/googleapis/google-cloud-python

extra:
  recipe-maintainers:
    - BrentDorsey
    - xylar
